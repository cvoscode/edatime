[package]
name = "edatime"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  "crates/edatime-core",
  "crates/edatime-store",
  "crates/edatime-query",
  "crates/edatime-ingest",
  "crates/edatime-service",
  "crates/edatime-bin",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Shared across all workspace crates
arrow = "58.0.0"
arrow-ipc = "58.0.0"
axum = { version = "0.8.8", features = ["multipart"] }
bytes = "1"
chrono = { version = "0.4.41", features = ["serde"] }
minmaxlttb = "0.1.4"
ndarray = { version = "0.16", features = ["rayon"] }
polars = { version = "0.53.0", features = ["lazy", "temporal", "dynamic_group_by", "parquet", "csv", "dtype-datetime", "ipc", "ipc_streaming", "is_in", "cum_agg"] }
rand = "0.8"
rayon = "1.10"
rustfft = "6.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.26.0"
thiserror = "1"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
futures-util = "0.3.32"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
toml = "0.8.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tower-http = { version = "0.6.10", features = ["cors", "compression-gzip", "fs", "set-header", "trace"] }

[dependencies]
edatime-core = { path = "crates/edatime-core" }
edatime-query = { path = "crates/edatime-query" }
edatime-store = { path = "crates/edatime-store" }
edatime-ingest = { path = "crates/edatime-ingest" }
edatime-service = { path = "crates/edatime-service" }

arrow = { workspace = true }
arrow-ipc = { workspace = true }
axum = { version = "0.8.8", features = ["multipart"] }
bytes = { workspace = true }
chrono = { workspace = true }
deadpool-postgres = { version = "0.14", features = ["serde"] }
minmaxlttb = "0.1.4"
ndarray = { version = "0.16", features = ["rayon"] }
polars = { workspace = true }
rayon = { workspace = true }
rustfft = "6.2.0"
serde = { workspace = true }
serde_json = { workspace = true }
statrs = "0.18"
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tower-http = { version = "0.6.10", features = ["cors", "compression-gzip", "fs", "set-header", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
toml = "0.8.23"

[dev-dependencies]
criterion = "0.5.1"
axum-test = "17"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true

# Workaround for https://github.com/rust-lang/rust/issues/157363.
#
# `ethnum` 1.5.2 contains `unsafe { mem::transmute(()) }` to construct a
# `TryFromIntError`, which stops compiling on rustc >= 1.97 because the
# error type's layout grew. `ethnum` 1.5.3 replaces the transmute with a
# safe `try_from(-1).unwrap_err()` call. We pull it in via polars-arrow
# transitively; pin it via git so the workspace builds against modern
# toolchains without waiting for polars to bump the dependency.
[patch.crates-io]
ethnum = { git = "https://github.com/nlordell/ethnum-rs", tag = "v1.5.3" }

