[dev-dependencies]
# Property-based testing — scoped to edatime-core where the bulk of pure
# arithmetic primitives live (temporal conversions, correlations, histograms,
# filters, validation, cache). Keeping this out of the service/query crates
# avoids the cost of building DataFrame strategies for integration-level code
# where property tests add little over the existing fixture-based suite.
proptest = "1"
