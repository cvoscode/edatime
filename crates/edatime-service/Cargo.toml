[package]
name = "edatime-service"
version.workspace = true
edition.workspace = true

[dependencies]
edatime-core = { path = "../edatime-core" }
edatime-query = { path = "../edatime-query" }
edatime-store = { path = "../edatime-store" }
edatime-ingest = { path = "../edatime-ingest" }
polars.workspace = true
arrow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
http-body.workspace = true
chrono.workspace = true
axum.workspace = true
base64 = "0.22"
tower-http = { version = "0.6.10", features = ["cors", "compression-gzip", "fs", "set-header", "trace"] }
minmaxlttb = "0.1.4"
rustfft = "6.2.0"
tempfile = { workspace = true }
ndarray = "0.16"
statrs = "0.18"
rand = { version = "0.8", features = ["std"] }
rayon = "1.10"
sha2 = "0.10.9"
zip = { version = "0.6.6", default-features = false }

[dev-dependencies]
criterion = "0.5.1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "causal"
harness = false

# Phase 0.2: reproducible Criterion benches for the three hot inner
# loops identified in backend_plan.md. Each is self-contained and uses a
# deterministic synthetic fixture so before/after comparisons from
# different hosts remain defensible.
[[bench]]
name = "scatter_sample"
harness = false

[[bench]]
name = "rolling_bands"
harness = false

[[bench]]
name = "correlations"
harness = false

[[bench]]
name = "scatter_matrix"
harness = false
